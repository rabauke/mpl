name: build-with-openmpi
run-name: Build MPL with OpenMPI
on: [push, pull_request, workflow_dispatch]
env:
  OPENMPI_VERSION: 6.0.0rc2
jobs:
  compile-mpl:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libcatch2-dev libevent-dev libhwloc-dev curl ca-certificates
      - name: Install OpenMPI ${{ env.OPENMPI_VERSION }}
        run: |
          ASSET_NAME="openmpi-${OPENMPI_VERSION}-linux-x86_64.tar.gz"
          CHECKSUM_NAME="${ASSET_NAME}.sha256"
          BASE_URL="https://github.com/rabauke/build-openmpi/releases/download/v${OPENMPI_VERSION}"
          curl -fSL "${BASE_URL}/${ASSET_NAME}" -o "${ASSET_NAME}"
          curl -fSL "${BASE_URL}/${CHECKSUM_NAME}" -o "${CHECKSUM_NAME}"
          sha256sum -c "${CHECKSUM_NAME}"
          sudo mkdir -p /opt/openmpi
          sudo tar -xzf "${ASSET_NAME}" -C /opt
          echo "/opt/openmpi/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/opt/openmpi/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "OPAL_PREFIX=/opt/openmpi" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/opt/openmpi" >> $GITHUB_ENV
      - name: Show OpenMPI information
        run: |
          which mpicxx mpirun
          ompi_info
      - name: Build mpl
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_INSTALL_PREFIX="$HOME/mpl" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DMPL_BUILD_EXAMPLES=ON ..
          cmake --build . -j
          cmake --build . --target install
      - name: Test mpl
        run: |
          cd build
          ctest --output-on-failure
      - run: echo "This job's status is ${{ job.status }}."
